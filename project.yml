name: Termite
options:
  bundleIdPrefix: com.termite
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

fileGroups:
  - project.yml
  - DESIGN.md

packages:
  SwiftTerm:
    # 1.12+ 引入 Metal GPU 渲染后端;1.14+ 内置 scrollback 搜索(高亮/正则)
    url: https://github.com/migueldeicaza/SwiftTerm.git
    from: 1.14.0

targets:
  Termite:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Termite
      - path: PtyHostShared
      # 远程访问 Web 客户端(folder reference 整体拷进 Resources/RemoteWeb)
      - path: RemoteWeb
        type: folder
        buildPhase: resources
    dependencies:
      - package: SwiftTerm
      # 只要构建顺序,不链接;产物由 postBuildScripts 拷进 bundle
      - target: PtyHostDaemon
        link: false
        embed: false
    postBuildScripts:
      - name: Embed termite-ptyhost
        script: |
          cp -f "$BUILT_PRODUCTS_DIR/termite-ptyhost" "$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/MacOS/termite-ptyhost"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/termite-ptyhost
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/MacOS/termite-ptyhost
    scheme:
      configVariants: []
      testTargets:
        - TermiteTests
    info:
      path: Termite/Info.plist
      properties:
        CFBundleDisplayName: Termite
        CFBundleShortVersionString: "1.28"
        CFBundleVersion: "29"
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
        # 允许 Finder/Dock 把文件夹拖到图标上(在该目录开新标签)
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSItemContentTypes:
              - public.folder
              - public.volume
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.termite.app
        SWIFT_VERSION: "5.0"
        # 编译器提取 SwiftUI 字面量与 String(localized:) 进 String Catalog
        SWIFT_EMIT_LOC_STRINGS: true
        # 终端不能开沙箱(需要完整文件系统/进程权限),也不加 entitlements。
        # 用稳定开发证书签名(而非 ad-hoc),避免每次重建被系统当陌生 app。
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 99LYH6FNPS
        ENABLE_HARDENED_RUNTIME: false
        DEAD_CODE_STRIPPING: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  TermiteMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TermiteMobile
    dependencies:
      - package: SwiftTerm
    info:
      path: TermiteMobile/Info.plist
      properties:
        CFBundleDisplayName: Termite
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: 扫描 Mac 上 Termite 设置页的配对二维码(Scan the pairing QR code in Termite on your Mac)
        NSLocalNetworkUsageDescription: 连接局域网内 Mac 上的 Termite(Connects to Termite on your Mac over the local network)
        # 数据面是 LAN/Tailscale 内网 ws://(IP 直连),不走公网明文
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.termite.mobile
        SWIFT_VERSION: "5.0"
        SWIFT_EMIT_LOC_STRINGS: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 99LYH6FNPS
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  PtyHostDaemon:
    type: tool
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: PtyHostShared
      - path: PtyHostDaemon
    settings:
      base:
        PRODUCT_NAME: termite-ptyhost
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 99LYH6FNPS
        DEAD_CODE_STRIPPING: true

  TermiteTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: TermiteTests
    dependencies:
      - target: Termite
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: true
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Termite.app/Contents/MacOS/Termite
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 99LYH6FNPS
