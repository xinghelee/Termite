name: Termite
options:
  bundleIdPrefix: com.termite
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

fileGroups:
  - project.yml
  - DESIGN.md

packages:
  SwiftTerm:
    # 1.12+ 引入 Metal GPU 渲染后端;1.14+ 内置 scrollback 搜索(高亮/正则)
    url: https://github.com/migueldeicaza/SwiftTerm.git
    from: 1.14.0
  SandboxServer:
    url: https://github.com/xinghelee/SandboxServer.git
    exactVersion: 0.1.0
    traits:
      - SandboxServerEnabled

targets:
  Termite:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Termite
      - path: PtyHostShared
      # 远程访问 Web 客户端(folder reference 整体拷进 Resources/RemoteWeb)
      - path: RemoteWeb
        type: folder
        buildPhase: resources
    dependencies:
      - package: SwiftTerm
      # 只要构建顺序,不链接;产物由 postBuildScripts 拷进 bundle
      - target: PtyHostDaemon
        link: false
        embed: false
    postBuildScripts:
      - name: Embed termite-ptyhost
        script: |
          cp -f "$BUILT_PRODUCTS_DIR/termite-ptyhost" "$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/MacOS/termite-ptyhost"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/termite-ptyhost
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/MacOS/termite-ptyhost
    scheme:
      configVariants: []
      testTargets:
        - TermiteTests
    info:
      path: Termite/Info.plist
      properties:
        CFBundleDisplayName: Termite
        CFBundleShortVersionString: "1.28"
        CFBundleVersion: "29"
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
        # 允许 Finder/Dock 把文件夹拖到图标上(在该目录开新标签)
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSItemContentTypes:
              - public.folder
              - public.volume
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.termite.app
        SWIFT_VERSION: "5.0"
        # 编译器提取 SwiftUI 字面量与 String(localized:) 进 String Catalog
        SWIFT_EMIT_LOC_STRINGS: true
        # 终端不能开沙箱(需要完整文件系统/进程权限),也不加 entitlements。
        # 用稳定开发证书签名(而非 ad-hoc),避免每次重建被系统当陌生 app。
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 99LYH6FNPS
        ENABLE_HARDENED_RUNTIME: false
        DEAD_CODE_STRIPPING: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 私有 API 胶水层用 ObjC 写(SimulatorBridge),Swift 只管编码与推流
        SWIFT_OBJC_BRIDGING_HEADER: Termite/Termite-Bridging-Header.h

  TermiteMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TermiteMobile
    dependencies:
      - package: SwiftTerm
      - package: SandboxServer
    info:
      path: TermiteMobile/Info.plist
      properties:
        CFBundleDisplayName: Termite
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad 多任务(非全屏 App)要求全方向支持,含倒置竖屏
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # termite://pair?host=..&port=..&t=.. 一键配对(链接/自动化直达)
        CFBundleURLTypes:
          - CFBundleURLName: com.termite.mobile
            CFBundleURLSchemes: [termite]
        # 文案本地化在 */InfoPlist.strings(此处仅兜底)
        NSCameraUsageDescription: 扫描 Mac 上 Termite 设置页的配对二维码
        NSLocalNetworkUsageDescription: 连接局域网内 Mac 上的 Termite
        NSBonjourServices:
          - _termite._tcp
          - _sandboxserver._tcp
        # 数据面是 LAN/Tailscale 内网的明文 ws://。原以为「ATS 豁免 IP 字面量」,实测不成立:
        # NSAllowsLocalNetworking 只豁免 RFC1918(10/8、172.16/12、192.168/16)与 .local,
        # Tailscale 的 100.64/10(CGNAT)不在其列,连 100.x 会被 -1022 拦在客户端,TCP 都不发出。
        # ATS 又不认 CIDR,例外域名写死某台 Mac 的 Tailscale IP 没有通用性,只能整体放行。
        # 坑:NSAllowsArbitraryLoads 不能与 NSAllowsLocalNetworking 并存 ——
        # 两者同时出现时,支持新 key 的系统会忽略前者,等于没配。
        # 待办:上架前改用 NWConnection 自研 WS 客户端(不受 ATS 约束),再摘掉这一项。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.termite.mobile
        SWIFT_VERSION: "5.0"
        SWIFT_EMIT_LOC_STRINGS: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 99LYH6FNPS
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  PtyHostDaemon:
    type: tool
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: PtyHostShared
      - path: PtyHostDaemon
    settings:
      base:
        PRODUCT_NAME: termite-ptyhost
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 99LYH6FNPS
        DEAD_CODE_STRIPPING: true

  TermiteTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: TermiteTests
    dependencies:
      - target: Termite
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: true
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Termite.app/Contents/MacOS/Termite
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 99LYH6FNPS
